<style>
:root{--pri:#0b6b4f;--pri2:#0e8560;--dark:#0b3d2e;--gold:#b8912f;--bg:#f3f6f4;--card:#fff;--text:#1f2933;--mut:#4a555c;--line:#e1e8e4;--red:#c0392b;--amber:#d98e04;--blue:#1f4a73;--sh:0 2px 10px rgba(16,40,32,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.55}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{margin:0}
/* header & nav */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:linear-gradient(135deg,#0a5a43,#0b6b4f);color:#fff;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.brand b{display:block;font-size:16.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;font-size:12px;color:#e6f4ee}
.ico{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;width:40px;height:40px;font-size:19px;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(16,40,32,.08);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:transparent;color:#3d4a52;font-size:11.5px;font-weight:700;padding:5px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button i{font-style:normal;font-size:20px;line-height:24px}.nav button.on{background:var(--pri);color:#fff}
main{padding:14px 12px 96px;max-width:1100px;margin:0 auto}
@media(min-width:900px){.nav{top:62px;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 10px;gap:4px;box-shadow:none}.nav button{flex:none;flex-direction:row;gap:10px;justify-content:flex-start;font-size:15px;padding:11px 12px}main{margin-left:200px;max-width:none;padding:20px 24px 40px}main>.wrap{max-width:none}.modal{align-items:center}.sheet{max-width:760px;border-radius:20px}}
@media(min-width:1300px){.g3d{grid-template-columns:repeat(4,1fr)}html,body{font-size:16px}}
/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card>h3,.ttl{font-size:18px;font-weight:700;color:#12352d;margin-bottom:10px}
.pg{font-size:21px;font-weight:700;color:#12352d;margin:2px 0 12px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}.g3d{grid-template-columns:repeat(3,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh)}.stat small{display:block;color:var(--mut);font-weight:600;font-size:13px}.stat b{font-size:21px;color:var(--pri)}.stat.red b{color:var(--red)}.stat.gold b{color:#8a6d1a}
.btn{border:0;background:var(--pri);color:#fff;font-weight:700;border-radius:12px;padding:11px 16px;cursor:pointer;font-size:15px}.btn:active{filter:brightness(.92)}
.btn.sec{background:#e9f0ec;color:#12352d;border:1px solid #bccbc3}.btn.red{background:var(--red)}.btn.gold{background:var(--gold)}.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}.btn.full{width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.bar .grow{flex:1;min-width:140px}
label{display:block;font-size:14px;font-weight:700;color:#26323a;margin:10px 0 4px}
input,select,textarea{width:100%;background:#fff;border:1.5px solid #cfd8d3;border-radius:12px;padding:10px 12px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(11,107,79,.14)}
input[type=checkbox],input[type=radio]{width:auto}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:10px;padding:9px 12px;font-weight:700;color:#3d4a52;cursor:pointer}.tabs button.on{background:var(--pri);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #edf2ef}.row:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;background:#eaf6f0;border:1px solid #bcdccd;color:var(--pri);display:grid;place-items:center;font-weight:700;flex:none}
.info{flex:1;min-width:0}.info b{display:block;font-size:15.5px;line-height:1.35;color:#12352d}.info small{display:block;color:var(--mut);font-size:13px}
.acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;background:#eaf6f0;color:var(--pri);white-space:nowrap}.badge.red{background:#fdecea;color:var(--red)}.badge.gold{background:#fff4d6;color:#8a6d1a}.badge.gray{background:#eef2f0;color:#3d4a52}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--pri)}.amt.out{color:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{border-bottom:1px solid #edf2ef;padding:8px 6px;text-align:left;vertical-align:middle}.tbl th{background:#f3f8f5;color:#12352d;font-weight:700;white-space:nowrap}.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.brand .logo{overflow:hidden;padding:0}.brand .logo img,.lbox .lg img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}.lbox .lg{overflow:hidden}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:16px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}.tile i{font-style:normal;font-size:30px}.tile b{font-size:15.5px;color:#12352d}.tile small{color:var(--mut);font-size:12.5px}
.pr .hd img{height:66px;width:66px;border-radius:50%;margin-bottom:2px}
.note{background:#fffaf0;border:1px solid #ecdcb0;color:#5a4710;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.seg{display:inline-flex;border:1.5px solid #cfd8d3;border-radius:10px;overflow:hidden}.seg button{border:0;background:#fff;padding:7px 11px;font-weight:700;font-size:13.5px;color:#3d4a52;cursor:pointer;border-right:1px solid #e1e8e4}.seg button:last-child{border-right:0}
.seg button.p.on{background:var(--pri);color:#fff}.seg button.a.on{background:var(--red);color:#fff}.seg button.l.on{background:var(--amber);color:#fff}
.mk{width:70px;padding:7px 6px;text-align:center}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,30,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-size:19px;color:#12352d;margin-bottom:6px}.sheet .x{float:right;border:0;background:#eef2f0;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.mrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #e1e8e4}.mrow label{margin:0;font-weight:600;flex:1}.mrow input{margin-top:3px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:#12352d;color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;max-width:90%;display:none;text-align:center}
#toast.err{background:var(--red)}
/* login */
.screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#f6fbf7,#e3f0e7)}
.lbox{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:62px 22px 22px;box-shadow:0 14px 40px rgba(31,90,55,.14);position:relative;border:1px solid #e3eee5}
.lbox .lg{position:absolute;left:50%;top:-44px;transform:translateX(-50%);width:88px;height:88px;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 6px 20px rgba(31,90,55,.2);display:grid;place-items:center;font-size:44px}
.lbox h1{font-size:21px;text-align:center;color:#12352d;margin:0 0 2px}.lbox p{text-align:center;color:var(--mut);margin:0 0 8px;font-size:13.5px}
.err{color:var(--red);font-size:13.5px;min-height:18px;margin-top:6px;text-align:center}
/* print */
#printArea{display:none}
.pr{font-family:'Noto Sans Bengali',sans-serif;color:#111;word-spacing:normal;letter-spacing:normal}
.pr .hd{text-align:center;border-bottom:3px double #0b6b4f;padding-bottom:6px;margin-bottom:10px}.pr .hd h1{margin:0;font-size:24px;color:#0b3d2e}.pr .hd div{font-size:13px}
.pr h2{text-align:center;font-size:18px;margin:6px 0 10px;text-decoration:underline}
.pr table{width:100%;border-collapse:collapse;font-size:14px}.pr th,.pr td{border:1px solid #333;padding:5px 7px}.pr th{background:#eef5f0}.pr td.n,.pr th.n{text-align:right}
.pr .info2{display:flex;flex-wrap:wrap;gap:4px 24px;font-size:14px;margin-bottom:10px}.pr .info2 div{min-width:45%}
.pr .sign{display:flex;justify-content:space-between;margin-top:46px;font-size:13px}.pr .sign span{border-top:1px solid #333;padding-top:3px;min-width:120px;text-align:center}
.pr .tbl{font-size:11px}.pr .tbl td,.pr .tbl th{padding:3px 2px}.pr .pb{page-break-after:always;padding:6px}.pr .pb:last-child{page-break-after:auto}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}@page{size:A4;margin:12mm}.pr .pb{border:0}}
</style>

/* ---------- utils ---------- */
var $=function(s,r){return(r||document).querySelector(s)};

var BND='০১২৩৪৫৬৭৮৯';
var bn=function(x){return String(x).replace(/\d/g,function(d){return BND[d]})};
var num=function(v){var n=parseFloat(String(v).replace(/[০-৯]/g,function(d){return BND.indexOf(d)}).replace(/,/g,''));return isNaN(n)?0:n};
var fm=function(n){n=Math.round(num(n)*100)/100;var neg=n<0;n=Math.abs(n);var s=n.toLocaleString('en-IN',{maximumFractionDigits:2});return(neg?'-':'')+bn(s)};
var money=function(n){return '৳ '+fm(n)};

var p2=function(n){return(n<10?'0':'')+n};
var todayISO=function(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
var monthLabel=function(m){var a=m.split('-');return MN[+a[1]-1]+' '+bn(a[0])};
var fdate=function(i){if(!i)return'';var a=i.split('-');return bn(a[2]+'/'+a[1]+'/'+a[0])};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};

function tcPrint(id){
  var s=stById(id);if(!s)return;var type=$('#tcType').value,date=$('#tcDate').value||todayISO(),note=$('#tcNote').value.trim(),mark=$('#tcMark').checked&&type.indexOf('ছাড়পত্র')===0;

  if(type.indexOf('ছাড়পত্র')===0)body='এই মর্মে প্রত্যয়ন করা যাইতেছে যে, '+who+' অত্র মাদ্রাসার <b>'+esc(s.cls)+'</b> শ্রেণির ছাত্র ছিল। সে '+fdate(s.adm)+' তারিখে ভর্তি হইয়া '+fdate(date)+' তারিখ পর্যন্ত অধ্যয়ন করিয়াছে। অত্র মাদ্রাসার বেতন ও অন্যান্য পাওনা '+(dues>0?'বাবদ <b>'+money(dues)+'</b> বকেয়া রহিয়াছে।':'সম্পূর্ণ পরিশোধ করিয়াছে।')+(note?' স্থানান্তরের কারণ: '+esc(note)+'।':'')+' তাহাকে অন্যত্র ভর্তির জন্য এই ছাড়পত্র প্রদান করা হইল। আমি তাহার উজ্জ্বল ভবিষ্যৎ ও উত্তরোত্তর সাফল্য কামনা করি।';
  else if(type.indexOf('প্রশংসা')===0)body='এই মর্মে প্রত্যয়ন করা যাইতেছে যে, '+who+' অত্র মাদ্রাসার <b>'+esc(s.cls)+'</b> শ্রেণির ছাত্র'+(s.status==='left'?' ছিল':'')+'। আমার জানামতে তাহার আচরণ ও চরিত্র ভালো। সে নিয়মিত ও শৃঙ্খলার সহিত অধ্যয়ন করিয়াছে।'+(note?' '+esc(note)+'।':'')+' আমি তাহার সর্বাঙ্গীণ উন্নতি ও মঙ্গল কামনা করি।';
  else body='এই মর্মে প্রত্যয়ন করা যাইতেছে যে, '+who+' অত্র মাদ্রাসার <b>'+esc(s.cls)+'</b> শ্রেণির একজন নিয়মিত ছাত্র। শিক্ষাবর্ষ: '+bn(esc(s.ses||cfg().session||''))+'; রোল নং: '+bn(s.roll||'-')+'; ভর্তির তারিখ: '+fdate(s.adm)+'।'+(note?' '+esc(note)+'।':'')+' তাহার আবেদনের প্রেক্ষিতে এই সনদ প্রদান করা হইল।';
  var rec={id:uid(),title:type+' — '+s.name,cat:'সনদ/ছাড়পত্র',date:date,no:no,note:note,sid:s.id,sname:s.name,kind:type};
  put('docs',rec);

  modal('<h3>🔁 পুনঃভর্তি — '+esc(s.name)+'</h3><div class="note">আগের সব তথ্য ও আদায়ের ইতিহাস থাকবে। ছাত্র আবার সক্রিয় হবে এবং নতুন তারিখ থেকে বেতন বকেয়া গণনা হবে।</div><label>শ্রেণি</label><select id="rdCls">'+clsOpts(s.cls)+'</select><div class="grid g2"><div><label>পুনঃভর্তির তারিখ</label><input id="rdDate" type="date" value="'+todayISO()+'"></div><div><label>শিক্ষাবর্ষ</label><input id="rdSes" value="'+esc(cfg().session||s.ses||'')+'"></div></div><div class="bar" style="margin-top:14px"><button class="btn grow" data-a="readmGo" data-id="'+id+'">✅ পুনঃভর্তি করুন</button></div>');
}
function readmGo(id){
  var s=stById(id);if(!s)return;var o=clean(s),d=$('#rdDate').value||todayISO();
  o.readm=(o.readm||[]).concat([{date:d,from:s.cls,was:s.status==='left'?(s.kind||'ঝরে পড়া'):'সক্রিয়'}]);
  o.cls=$('#rdCls').value;o.ses=$('#rdSes').value.trim()||o.ses||'';o.status='active';o.kind='';o.leftDate='';o.leftNote='';o.startMonth=d.slice(0,7);
  if(o.cls!==s.cls)o.roll=nextRoll(o.cls);
  put('students',o).then(function(){toast('পুনঃভর্তি সম্পন্ন ✅')});closeModal();
}

function stCsv(){

  S.students.slice().sort(function(a,b){return String(a.cls).localeCompare(String(b.cls))||byRoll(a,b)}).forEach(function(s){rows.push([s.admNo||'',s.name,s.gender||'',s.cls,s.roll||'',s.father||'',s.mother||'',s.phone||'',s.fPh||'',s.mPh||'',s.dob||'',s.bregNo||'',s.blood||'',s.religion||'',s.addr||'',(s.sameAddr===false?s.paddr:s.addr)||'',s.adm||'',s.fee||'',s.status==='left'?(s.kind||'ঝরে পড়া'):'সক্রিয়'])});
  dl('students-'+todayISO()+'.csv',csvText(rows),'text/csv');toast('Excel/CSV ফাইল নামানো হয়েছে');
}

function monthIn(m){return feesIn(m)+donsIn(m)+S.cash.reduce(function(a,c){return a+(c.type==='in'&&(c.date||'').slice(0,7)===m?num(c.amt):0)},0)}
function monthOut(m){return S.cash.reduce(function(a,c){return a+(c.type==='out'&&(c.date||'').slice(0,7)===m?num(c.amt):0)},0)}
function payRow(p,withDel){
  var s=stById(p.sid),det=p.type==='বেতন'?(p.items||[]).map(function(i){return monthLabel(i.m)}).join(', '):'';
  return'<div class="row"><div class="info"><b>'+esc(s?s.name:'(মুছে ফেলা ছাত্র)')+'</b><small>'+esc(p.type)+(det?' • '+esc(det):'')+' • '+fdate(p.date)+' • রসিদ নং '+bn(p.no||'-')+'</small></div><span class="amt in">'+money(p.amount)+'</span><div class="acts"><button class="btn sm sec" data-a="rcpt" data-id="'+p.id+'" title="রসিদ">🧾</button>'+(withDel?'<button class="btn sm red" data-a="payDel" data-id="'+p.id+'" title="মুছুন">🗑</button>':'')+'</div></div>';
}
function dueList(){
  var pa=paidAll(),l=activeSts(UI.fc).map(function(s){return{s:s,d:duesOf(s,pa)}}).filter(function(x){return x.d.length}).sort(function(a,b){return sumDue(b.d)-sumDue(a.d)});
  if(!l.length)return'<div class="empty">কোনো বকেয়া নেই 🎉</div>';
  return l.map(function(x){var s=x.s,t=encodeURIComponent('আসসালামু আলাইকুম। আপনার সন্তান '+s.name+' ('+s.cls+')-এর '+bn(x.d.length)+' মাসের বেতন বকেয়া আছে, মোট '+money(sumDue(x.d))+'। অনুগ্রহ করে পরিশোধ করুন। — '+cfg().name);
    return'<div class="row"><div class="av">'+bn(s.roll||'-')+'</div><div class="info"><b data-a="stView" data-id="'+s.id+'" style="cursor:pointer">'+esc(s.name)+'</b><small>'+esc(s.cls)+' • '+x.d.slice(0,3).map(function(d){return monthLabel(d.m)}).join(', ')+(x.d.length>3?' …':'')+'</small></div><div style="text-align:right"><div class="amt out">'+money(sumDue(x.d))+'</div><small style="color:#4a555c">'+bn(x.d.length)+' মাস</small></div><div class="acts"><button class="btn sm" data-a="feeForm" data-id="'+s.id+'">আদায়</button>'+(s.phone?'<a class="btn sm sec" href="https://wa.me/'+phoneWA(s.phone)+'?text='+t+'" target="_blank" rel="noopener">📲</a>':'')+'</div></div>'}).join('');
}
function payList(){
  var l=S.payments.filter(function(p){return !UI.pm||(p.date||'').slice(0,7)===UI.pm}).sort(function(a,b){return String(b.date+b.ts).localeCompare(String(a.date+a.ts))}).slice(0,200);
  var tot=l.reduce(function(a,p){return a+num(p.amount)},0);
  return(l.length?'<div class="note" style="background:#eaf6f0;border-color:#bcdccd;color:#0b3d2e">মোট '+bn(l.length)+'টি আদায় = <b>'+money(tot)+'</b></div>'+l.map(function(p){return payRow(p,true)}).join(''):'<div class="empty">এই সময়ে কোনো আদায় নেই</div>');
}
function vFees(){
  var pa=paidAll(),cur=todayISO().slice(0,7),td=0,nd=0;
  activeSts().forEach(function(s){var d=duesOf(s,pa);if(d.length){nd++;td+=sumDue(d)}});
  var h='<div class="pg">💰 বেতন ও ফি</div><div class="grid g4" style="margin-bottom:12px"><div class="stat"><small>এই মাসে আদায়</small><b>'+money(feesIn(cur))+'</b></div><div class="stat red"><small>মোট বকেয়া</small><b>'+money(td)+'</b></div><div class="stat"><small>বকেয়াধারী ছাত্র</small><b>'+bn(nd)+' জন</b></div><button class="btn" data-a="feeForm" style="font-size:16px">➕ ফি আদায়</button></div>';
  h+='<div class="tabs"><button class="'+(UI.feeTab==='dues'?'on':'')+'" data-a="ftab" data-v="dues">বকেয়া তালিকা</button><button class="'+(UI.feeTab==='pays'?'on':'')+'" data-a="ftab" data-v="pays">আদায়ের তালিকা</button></div>';
  if(UI.feeTab==='dues')h+='<div class="bar"><select id="fc" style="width:auto">'+clsOpts(UI.fc,1)+'</select><button class="btn sec sm" data-a="duePrint">🖨️ বকেয়া তালিকা প্রিন্ট</button></div><div class="card" id="dList">'+dueList()+'</div>';
  else h+='<div class="bar"><input type="month" id="pm" value="'+UI.pm+'" style="width:auto"><button class="btn sec sm" data-a="pmAll">সব সময়</button></div><div class="card" id="pList">'+payList()+'</div>';
  return h;
}
function feeForm(sid){
  var sts=activeSts();if(!sts.length){toast('আগে ছাত্র ভর্তি করুন',true);return}
  var opts=(sid?'':'<option value="">— ছাত্র বাছাই করুন —</option>')+fOpts(sts,sid);
  modal('<h3>💰 ফি আদায়</h3><label>ছাত্র</label>'+(sid?'':'<input id="fFind" placeholder="🔎 নাম বা রোল লিখে খুঁজুন" style="margin-bottom:6px">')+'<select id="fSid">'+opts+'</select><label>ফির ধরন</label><select id="fType"><option>বেতন</option><option>ভর্তি ফি</option><option>পরীক্ষা ফি</option><option>অন্যান্য</option></select><div id="fMonths"></div><label>টাকার পরিমাণ (৳)</label><input id="fAmt" inputmode="decimal" placeholder="0"><div class="grid g2"><div><label>তারিখ</label><input id="fDate" type="date" value="'+todayISO()+'"></div><div><label>মাধ্যম</label><select id="fMeth"><option>হাতে নগদ</option><option>বিকাশ</option><option>নগদ (Nagad)</option><option>রকেট</option><option>ব্যাংক</option></select></div></div><label>নোট (ঐচ্ছিক)</label><input id="fNote"><div style="margin-top:14px"><button class="btn full" data-a="feeSave">💾 আদায় সংরক্ষণ</button></div>');
  fillMonths();
}
function fOpts(sts,sel){return sts.map(function(s){return'<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+esc(s.cls)+' — '+bn(s.roll||'-')+'. '+esc(s.name)+'</option>'}).join('')}
function fillMonths(){
  var box=$('#fMonths');if(!box)return;var type=$('#fType').value,s=stById($('#fSid').value);
  if(type!=='বেতন'||!s){box.innerHTML='';return}
  var pa=paidAll(),ds=duesOf(s,pa),cur=todayISO().slice(0,7),fee=num(s.fee),pm=pa[s.id]||{},ms=ds.map(function(x){return{m:x.m,due:x.due,pre:true}});
  for(var i=1;i<=3;i++){var m=addMonths(cur,i),d=feeAt(s,m)-(pm[m]||0);if(d>0.009)ms.push({m:m,due:d,pre:false})}
  box.innerHTML=ms.length?'<label>কোন কোন মাসের বেতন (মাসিক ফি '+money(fee)+')</label>'+ms.map(function(x){return'<div class="mrow"><input type="checkbox" class="fm" id="fm_'+x.m+'" data-m="'+x.m+'" data-due="'+x.due+'"'+(x.pre?' checked':'')+'><label for="fm_'+x.m+'">'+monthLabel(x.m)+(x.pre?'':' (অগ্রিম)')+'</label><b style="color:'+(x.pre?'#c0392b':'#4a555c')+'">'+money(x.due)+'</b></div>'}).join(''):'<div class="note">এই ছাত্রের বেতন হিসাব শুরুর মাস এখনও আসেনি।</div>';
  recalc();
}
function recalc(){var a=$('#fAmt');if(!a||a.dataset.t==='1')return;var t=0;$$('.fm:checked').forEach(function(c){t+=num(c.dataset.due)});a.value=t?String(Math.round(t*100)/100):''}
function nextRcpt(){var m=0;S.payments.forEach(function(p){m=Math.max(m,num(p.no))});return m+1}
function feeSave(){
  var sid=$('#fSid').value,type=$('#fType').value,amt=num($('#fAmt').value);
  if(!sid){toast('ছাত্র বাছাই করুন',true);return}
  if(!amt||amt<=0){toast('টাকার পরিমাণ লিখুন',true);return}
  var items=[];
  if(type==='বেতন'){var ch=$$('.fm:checked');if(!ch.length){toast('অন্তত একটি মাসে টিক চিহ্ন দিন',true);return}var rem=amt;ch.forEach(function(c,i){var due=num(c.dataset.due),a=(i===ch.length-1)?rem:Math.min(due,rem);if(a>0){items.push({m:c.dataset.m,a:Math.round(a*100)/100});rem-=a}})}
  var p={id:uid(),sid:sid,type:type,amount:amt,date:$('#fDate').value||todayISO(),meth:$('#fMeth').value,note:$('#fNote').value.trim(),items:items,no:nextRcpt()};
  put('payments',p);
  modal('<h3>✅ আদায় সংরক্ষিত</h3><p>'+esc((stById(sid)||{}).name)+' — <b>'+money(amt)+'</b> • রসিদ নং '+bn(p.no)+'</p><div class="bar"><button class="btn grow" data-a="rcpt" data-id="'+p.id+'">🧾 রসিদ প্রিন্ট</button><button class="btn sec grow" data-a="close">বন্ধ করুন</button></div>');
}

function bnWords(n){
  n=Math.round(num(n)*100)/100;var t=Math.floor(n),ps=Math.round((n-t)*100),o=[];
  var cr=Math.floor(t/1e7),lk=Math.floor(t%1e7/1e5),th=Math.floor(t%1e5/1e3),hu=Math.floor(t%1e3/100),r=t%100;
  if(cr)o.push(BW[cr]+' কোটি');if(lk)o.push(BW[lk]+' লক্ষ');if(th)o.push(BW[th]+' হাজার');if(hu)o.push(BW[hu]+'শত');if(r||!o.length)o.push(BW[r]);
  var w=o.join(' ')+' টাকা';if(ps)w+=' '+BW[ps]+' পয়সা';return w+' মাত্র'
}

function receiptCopy(p){
  var s=stById(p.sid)||{name:'—'},C='#1f2a6b',amt={},det={},pm=(p.date||todayISO()).slice(0,7);
  var add=function(k,a,d){amt[k]=(amt[k]||0)+num(a);if(d)det[k]=(det[k]?det[k]+', ':'')+d};
  if(p.type==='বেতন')(p.items||[]).forEach(function(i){var k=i.m===pm?1:(i.m<pm?2:4);add(k,i.a,monthLabel(i.m))});
  else if(p.type==='ভর্তি ফি')add(0,p.amount,p.note);
  else if(p.type==='পরীক্ষা ফি')add(8,p.amount,p.note);
  else add(15,p.amount,p.note||p.type);
  var th='border:1.2px solid '+C+';padding:1px 4px;min-height:24px;',rows='';
  RCPT_ITEMS.forEach(function(t,k){var a=amt[k],tk=a!=null?Math.floor(a):'',ps=a!=null?Math.round((a-Math.floor(a))*100):'';

  '<div style="text-align:center;margin:7px 0 5px"><span style="display:inline-block;background:'+C+';color:#fff;border-radius:14px;padding:2px 18px;font-size:13px;font-weight:700">বেতন আদায়ের রসিদ</span></div>'+
  '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span>নং- <b style="font-size:13px">'+bn(p.no||'-')+'</b></span><span>তারিখ: <b>'+fdate(p.date)+'</b></span></div>'+
  '<div style="font-size:11px;line-height:2"><div>নাম: <span style="'+ln+'width:84%;font-weight:700;color:#111">'+esc(s.name)+'</span></div><div>শ্রেণী: <span style="'+ln+'width:30%;font-weight:700;color:#111">'+esc(s.cls||'')+'</span> রোল: <span style="'+ln+'width:14%;font-weight:700;color:#111">'+bn(s.roll||'')+'</span> শাখা: <span style="'+ln+'width:16%"></span></div></div>'+
  '<table style="width:100%;border-collapse:collapse;margin-top:5px;color:'+C+'"><tr><th style="'+th+'font-size:8.5px">ক্রমিক নং</th><th style="'+th+'font-size:11px">বিবরণ</th><th style="'+th+'font-size:11px">টাকা</th><th style="'+th+'font-size:9.5px">পয়সা</th></tr>'+rows+
  '<tr><td colspan="2" style="'+th+'text-align:right;font-size:11px;font-weight:700">মোট টাকা</td><td style="'+th+'text-align:right;font-weight:800;font-size:12px">'+bn(ttk)+'</td><td style="'+th+'text-align:right;font-weight:800;font-size:11px">'+(tps?bn(tps):'')+'</td></tr></table>'+

}

function gradeOf(pct){var g=cfg().grades;for(var i=0;i<g.length;i++)if(pct>=g[i].min)return g[i];return g[g.length-1]}
function gradeOfGPA(gpa){var g=cfg().grades.slice().sort(function(a,b){return b.p-a.p});for(var i=0;i<g.length;i++)if(g[i].p<=gpa+1e-9)return g[i].g;return g[g.length-1].g}
function calcResult(ex){
  var rows=activeSts(ex.cls).map(function(st){
    var mk=(ex.marks&&ex.marks[st.id])||{},tot=0,full=0,fail=false,pts=0,subs=[];
    ex.subjects.forEach(function(sb,i){var v=mk[i],has=v!==undefined&&v!==null&&v!=='',o=has?num(v):0,pct=sb.full?o/sb.full*100:0,g=gradeOf(pct),pass=pct>=num(cfg().pass);if(!pass)fail=true;tot+=o;full+=sb.full;pts+=g.p;subs.push({n:sb.n,full:sb.full,o:o,has:has,g:g.g,pass:pass})});
    var pct=full?tot/full*100:0,gpa=fail?0:(ex.subjects.length?pts/ex.subjects.length:0);
    return{st:st,subs:subs,tot:tot,full:full,pct:pct,gpa:gpa,grade:fail?'F':gradeOfGPA(gpa),fail:fail,entered:Object.keys(mk).length>0};
  });
  var ranked=rows.filter(function(r){return r.entered&&!r.fail}).sort(function(a,b){return b.tot-a.tot||byRoll(a.st,b.st)});
  ranked.forEach(function(r,i){r.pos=i+1});
  return rows;
}

function rcPrint(sid){
  var s=stById(sid);if(!s)return;
  var exs=S.exams.filter(function(e){return e.cls===s.cls}).sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''))}),rows=[],sp=0,sn=0;

    var rem=S.remarks.filter(function(x){return x.stid===st.id&&x.vis!==false}).sort(function(a,b){return b.ts-a.ts}).slice(0,6).map(function(x){return{d:x.date,k:x.kind,t:x.text,by:x.tname||''}}),hw=S.homework.filter(function(x){return x.cls===st.cls}).sort(function(a,b){return b.ts-a.ts}).slice(0,6).map(function(x){return{d:x.date,s:x.subject||'',t:x.title,b:x.body||'',du:x.due||''}});
    ops.push(['pub',o.gcode,{rem:rem,hw:hw,name:st.name,cls:st.cls,roll:st.roll||'',father:st.father||'',fee:num(st.fee),dues:d.map(function(x){return{m:x.m,due:x.due}}),due:sumDue(d),pays:pays,att:{p:pr,a:ab,l:lv,m:m0},res:rs,upd:today}]);
  });
  ops.push(['pub','_info',{name:c.name,addr:c.addr||'',phone:c.phone||'',session:c.session||'',bkash:c.bkash||'',nagad:c.nagad||'',rocket:c.rocket||'',payNote:c.payNote||'',upd:today}]);
  toast('হালনাগাদ হচ্ছে…');
  var chunks=[];for(var i=0;i<ops.length;i+=400)chunks.push(ops.slice(i,i+400));
  var p=Promise.resolve();
  chunks.forEach(function(ch){p=p.then(function(){var b=fs.batch();ch.forEach(function(o){var ref=base.collection(o[0]).doc(String(o[1]).replace(/\//g,'-'));if(o[2]===null)b.delete(ref);else b.set(ref,o[2])});return b.commit()})});
  p.then(function(){UI.pubAt=today+' '+new Date().toTimeString().slice(0,5);toast('পাবলিক পাতা হালনাগাদ হয়েছে ✅');render()}).catch(err);
}

  if(!yr||!em){toast('শিক্ষাবর্ষ ও কার্যকর মাস দিন',true);return}

    var c=sel.dataset.pc,dest=sel.value;

  ask(bn(moves.length)+' জন ছাত্রের শ্রেণি বদলে যাবে। ব্যাকআপ নিয়েছেন তো? এগিয়ে যাবেন?','এগিয়ে যান',function(){

  });

var RULES=function(u){u=u||'আপনার-UID';return"rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /madrasa/{document=**} {\n      allow read, write: if request.auth != null\n        && request.auth.uid == '"+u+"';\n    }\n    match /madrasa/main/notices/{id} { allow read: if true; }\n    function tLinked(){ return request.auth != null && exists(/databases/$(database)/documents/madrasa/main/tlink/$(request.auth.uid)); }\n    function tCls(){ return get(/databases/$(database)/documents/madrasa/main/tlink/$(request.auth.uid)).data.get('cls', []); }\n    function tSid(){ return get(/databases/$(database)/documents/madrasa/main/tlink/$(request.auth.uid)).data.sid; }\n    match /madrasa/main/tlink/{uid} { allow get: if request.auth != null && request.auth.uid == uid; }\n    match /madrasa/main/tchreq/{uid} {\n      allow get: if request.auth != null && request.auth.uid == uid;\n      allow create: if request.auth != null && request.auth.uid == uid && request.resource.data.status == 'pending'\n        && request.resource.data.keys().hasOnly(['id','uid','name','phone','status','ts']);\n    }\n    match /madrasa/main/staff/{id} { allow get: if tLinked() && id == tSid(); }\n    match /madrasa/main/duties/{id} { allow read: if tLinked() && resource.data.sid == tSid(); }\n    match /madrasa/main/routine/{id} { allow read: if tLinked() && resource.data.tid == tSid(); }\n    match /madrasa/main/evals/{id} { allow read: if tLinked() && resource.data.sid == tSid(); }\n    match /madrasa/main/cash/{id} { allow read: if tLinked() && resource.data.stf == tSid(); }\n    match /madrasa/main/halldu/{id} { allow read: if tLinked() && (resource.data.sup == tSid() || resource.data.asst == tSid() || resource.data.insp == tSid() || tSid() in resource.data.get('insps', [])); allow update: if tLinked() && resource.data.sup == tSid() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['supOk','supOkAt']) && request.resource.data.supOk is bool; }\n    match /madrasa/main/tfix/{id} { allow read: if tLinked() && resource.data.sid == tSid(); allow create: if tLinked() && request.resource.data.sid == tSid() && request.resource.data.status == 'pending' && request.resource.data.keys().hasOnly(['id','sid','sname','date','inT','outT','reason','status','ts']); }\n    match /madrasa/main/exams/{id} {\n      allow read: if tLinked() && resource.data.cls in tCls();\n      allow update: if tLinked() && resource.data.cls in tCls() && request.resource.data.cls == resource.data.cls\n        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['marks','ts']);\n    }\n    match /madrasa/main/homework/{id} {\n      allow read: if tLinked() && resource.data.cls in tCls();\n      allow create: if tLinked() && request.resource.data.cls in tCls() && request.resource.data.sid == tSid()\n        && request.resource.data.keys().hasOnly(['id','cls','sid','tname','date','subject','title','body','due','ts']);\n      allow delete: if tLinked() && resource.data.sid == tSid();\n    }\n    match /madrasa/main/remarks/{id} {\n      allow read: if tLinked() && resource.data.cls in tCls();\n      allow create: if tLinked() && request.resource.data.cls in tCls() && request.resource.data.tid == tSid()\n        && request.resource.data.keys().hasOnly(['id','cls','stid','stname','kind','text','vis','date','tid','tname','ts']);\n      allow delete: if tLinked() && resource.data.tid == tSid();\n    }\n    match /madrasa/main/tcheck/{id} {\n      allow read: if tLinked() && resource.data.sid == tSid();\n      allow create: if tLinked() && request.resource.data.sid == tSid() && id == request.resource.data.date + '_' + tSid()\n        && request.resource.data.at == request.time && request.resource.data.keys().hasOnly(['id','sid','sname','date','at']);\n      allow update: if tLinked() && resource.data.sid == tSid() && !('out' in resource.data) && request.resource.data.out == request.time\n        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['out']);\n    }\n    match /madrasa/main/students/{id} { allow read: if tLinked() && resource.data.cls in tCls(); }\n    match /madrasa/main/attendance/{id} {\n      allow read: if tLinked() && resource.data.cls in tCls();\n      allow create: if tLinked() && request.resource.data.cls in tCls() && request.resource.data.keys().hasOnly(['id','date','cls','rec','ts','by']);\n      allow update: if tLinked() && resource.data.cls in tCls() && request.resource.data.cls == resource.data.cls && request.resource.data.keys().hasOnly(['id','date','cls','rec','ts','by']);\n    }\n    match /madrasa/main/leaves/{id} {\n      allow read: if tLinked() && resource.data.sid == tSid();\n      allow create: if tLinked() && request.resource.data.sid == tSid() && request.resource.data.status == 'pending'\n        && request.resource.data.keys().hasOnly(['id','sid','sname','type','from','to','days','reason','status','applied','ts','by']);\n      allow update: if tLinked() && resource.data.sid == tSid() && resource.data.status == 'pending'\n        && request.resource.data.status == 'cancelled' && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','ts']);\n    }\n    match /madrasa/main/people/{id} { allow read: if true; }\n    match /madrasa/main/pub/{id} { allow get: if true; }\n    match /madrasa/main/payreq/{id} {\n      allow create: if request.resource.data.keys().hasOnly(['id','purpose','code','name','phone','amt','method','trx','note','status','date','ts'])\n        && request.resource.data.status == 'pending'\n        && request.resource.data.amt is number\n        && request.resource.data.amt > 0 && request.resource.data.amt <= 10000000\n        && request.resource.data.name is string\n        && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 80\n        && request.resource.data.trx is string && request.resource.data.trx.size() <= 40;\n    }\n  }\n}"};

function restore(file){
  var fr=new FileReader();fr.onload=function(){
    var d;try{d=JSON.parse(fr.result)}catch(e){toast('ফাইলটি সঠিক ব্যাকআপ নয়',true);return}
    if(!d||!d.settings){toast('ফাইলটি সঠিক ব্যাকআপ নয়',true);return}
    ask('ব্যাকআপ থেকে তথ্য ফেরত আনবেন? একই আইডির বর্তমান তথ্য বদলে যাবে।','ফেরত আনুন',function(){
    if(!FB){COLS.forEach(function(c){var m={};S[c].forEach(function(x){m[x.id]=x});(d[c]||[]).forEach(function(x){m[x.id]=x});S[c]=Object.keys(m).map(function(k){return m[k]})});S.settings=Object.assign(clean(DEF),d.settings);persist();render();toast('তথ্য পুনরুদ্ধার হয়েছে ✅');return}
    var ops=[];COLS.forEach(function(c){(d[c]||[]).forEach(function(x){ops.push([c,x])})});
    var chunks=[];for(var i=0;i<ops.length;i+=400)chunks.push(ops.slice(i,i+400));
    var p=base.collection('meta').doc('settings').set(d.settings);
    chunks.forEach(function(ch){p=p.then(function(){var b=fs.batch();ch.forEach(function(o){b.set(base.collection(o[0]).doc(String(o[1].id).replace(/\//g,'-')),o[1])});return b.commit()})});
    p.then(function(){toast('তথ্য পুনরুদ্ধার হয়েছে ✅')}).catch(err);
    });
  };fr.readAsText(file);
}

function fbSave(){
  var t=$('#fbTxt').value,o={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(function(k){var m=t.match(new RegExp(k+'\\s*[:=]\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]});

  localStorage.setItem('mdr-fbcfg',JSON.stringify(o));location.reload();
}

  if((r.rem||[]).length)h+='<div class="card"><h3>💬 শিক্ষকের মন্তব্য</h3>'+r.rem.map(function(x){return'<div class="row"><div class="info"><b>'+esc(x.k)+'</b><small>'+fdate(x.d)+' • '+esc(x.by)+'</small><small>'+esc(x.t)+'</small></div></div>'}).join('')+'</div>';
  if((r.pays||[]).length)h+='<div class="card"><h3>🧾 সাম্প্রতিক আদায়</h3>'+r.pays.map(function(p){return'<div class="row"><div class="info"><b>'+esc(p.t||'')+(p.m?' — '+esc(p.m):'')+'</b><small>'+fdate(p.d)+' • রসিদ '+bn(p.no||'-')+'</small></div><span class="amt in">'+money(p.a)+'</span></div>'}).join('')+'</div>';
  h+='<div style="font-size:12px;color:#5b6b63;text-align:center">তথ্য হালনাগাদ: '+fdate(r.upd)+'</div>';
  return h;
}
function pubFind(){
  var c=($('#pcCode').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');PUB.code=c;
  if(c.length<6){PUB.msg='সঠিক কোড লিখুন';pubRender();return}
  if(!FB||!base){PUB.msg='ইন্টারনেট/সংযোগ নেই';pubRender();return}
  PUB.msg='খোঁজা হচ্ছে…';$('#pcErr').textContent=PUB.msg;
  base.collection('pub').doc(c).get().then(function(d){
    if(!d.exists){PUB.res=null;PUB.msg='এই কোডে কোনো তথ্য পাওয়া যায়নি';}
    else{PUB.res=d.data();PUB.msg='';try{localStorage.setItem('mdr-gcode',c)}catch(e){}}
    pubRender();
  }).catch(function(){PUB.res=null;PUB.msg='তথ্য আনা যায়নি — ইন্টারনেট দেখুন';pubRender()});
}
function pubPayHTML(I){
  if(PUB.done)return'<div class="card" style="text-align:center"><h3>✅ অনুরোধ প্রেরণ করা হয়েছে</h3><div style="font-size:14px">মাদ্রাসা কর্তৃপক্ষ টাকা মিলিয়ে নিলে রসিদ ও হিসাবে যুক্ত হবে। জাযাকাল্লাহ।</div><button class="btn sec" style="margin-top:10px" data-a="pubTab" data-v="pay">আরেকটি প্রেরণ করুন</button></div>';
  var nums=[];if(I.bkash)nums.push(['বিকাশ',I.bkash]);if(I.nagad)nums.push(['নগদ',I.nagad]);if(I.rocket)nums.push(['রকেট/ব্যাংক',I.rocket]);
  return'<div class="card"><h3>💳 অনলাইনে অর্থ প্রেরণ করুন</h3>'+(nums.length?nums.map(function(n){return'<div class="row"><div class="info"><b>'+n[0]+'</b><small style="font-size:16px;font-weight:700;color:#12352d">'+bn(esc(n[1]))+'</small></div><button class="btn sm sec" data-a="copy" data-v="'+esc(n[1])+'">📋 কপি</button></div>'}).join(''):'<div class="note">অর্থ প্রদানের নম্বর এখনও দেওয়া হয়নি।</div>')+(I.payNote?'<div class="note" style="margin-top:8px">'+esc(I.payNote)+'</div>':'')+'<div style="font-size:13px;color:#4a555c;margin-top:8px">১) উপরের নম্বরে Send Money করুন ২) নিম্নের ফর্মে TrxID সহ তথ্য প্রদান করুন। কর্তৃপক্ষ যাচাই করে গ্রহণ করবেন।</div></div>'+
  '<div class="card"><h3>তথ্য প্রদান করুন</h3><label>কী বাবদ</label><select id="pyPur"><option>বেতন</option><option>দান</option><option>অন্যান্য</option></select><label>অভিভাবক কোড (বেতনের জন্য)</label><input id="pyCode" value="'+esc(PUB.code||'')+'" style="text-transform:uppercase"><label>আপনার নাম *</label><input id="pyName"><label>মোবাইল *</label><input id="pyPhone" type="tel" inputmode="tel"><div class="grid g2"><div><label>টাকা *</label><input id="pyAmt" inputmode="decimal"></div><div><label>মাধ্যম</label><select id="pyMeth"><option>বিকাশ</option><option>নগদ</option><option>রকেট</option><option>ব্যাংক</option></select></div></div><label>TrxID *</label><input id="pyTrx" style="text-transform:uppercase"><label>নোট</label><input id="pyNote"><div class="err" id="pyErr"></div><button class="btn full" style="margin-top:8px" data-a="pubPay">📨 অনুরোধ প্রেরণ করুন</button></div>';
}
function pubPay(){
  var g=function(i){return($('#'+i).value||'').trim()},name=g('pyName'),amt=num(g('pyAmt')),trx=g('pyTrx').toUpperCase(),ph=g('pyPhone');
  var e=$('#pyErr');
  if(!name||!ph||!trx||amt<=0){e.textContent='নাম, মোবাইল, টাকা ও TrxID লিখুন';return}
  if(!FB||!base){e.textContent='ইন্টারনেট/সংযোগ নেই';return}
  var id=uid(),o={id:id,purpose:g('pyPur'),code:g('pyCode').toUpperCase().slice(0,12),name:name.slice(0,80),phone:ph.slice(0,20),amt:amt,method:g('pyMeth'),trx:trx.slice(0,40),note:g('pyNote').slice(0,120),status:'pending',date:todayISO(),ts:Date.now()};
  e.textContent='প্রেরণ করা হচ্ছে…';
  base.collection('payreq').doc(id).set(o).then(function(){PUB.done=true;pubRender()}).catch(function(){e.textContent='প্রেরণ করা যায়নি — ইন্টারনেট দেখুন (বা মাদ্রাসা কর্তৃপক্ষ Rules হালনাগাদ করেননি)'});
}
document.addEventListener('gesturestart',function(e){e.preventDefault()});document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});

/* ---------- boot ---------- */
function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');ready=true;applyPref();render()}
function loadScript(u){return new Promise(function(res,rej){var s=document.createElement('script');s.src=u;s.onload=res;s.onerror=function(){rej(new Error('network'))};document.head.appendChild(s)})}
function setLogo(){var a=$('#hLogo'),b=$('#lgLogo');if(a)a.innerHTML='<img src="'+LOGO+'" alt="">';if(b)b.innerHTML='<img src="'+LOGO+'" alt="">';var l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l)}
function boot(){setLogo();
  if(!FB){loadLocal();showApp();return}
  var B='https://www.gstatic.com/firebasejs/10.14.1/';
  loadScript(B+'firebase-app-compat.js').then(function(){return loadScript(B+'firebase-auth-compat.js')}).then(function(){return loadScript(B+'firebase-firestore-compat.js')}).then(function(){
    firebase.initializeApp(CFG);auth=firebase.auth();fs=firebase.firestore();
    try{fs.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
    try{fs.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
    base=fs.collection('madrasa').doc('main');var listening=false;
    auth.onAuthStateChanged(function(u){
      if(u){curUser=u;if(!listening){listening=true;listen()}if(PUB.on){PUB.on=false;$('#pub').classList.add('hidden')}showApp()}
      else{curUser=null;ready=false;$('#app').classList.add('hidden');if(location.hash==='#public'&&!PUB.on)pubShow();else if(!PUB.on)$('#login').classList.remove('hidden')}
    });
  }).catch(function(){document.body.innerHTML='<div style="padding:30px;text-align:center;font-family:sans-serif"><h2>ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না</h2><p>সংযোগ যাচাই করে পাতাটি পুনরায় লোড করুন।</p></div>'});
  $('#lform').addEventListener('submit',function(e){
    e.preventDefault();$('#lErr').textContent='';var b=$('#lBtn');b.disabled=true;b.textContent='অপেক্ষা করুন…';
    auth.signInWithEmailAndPassword($('#lEmail').value.trim(),$('#lPass').value).catch(function(er){var c=String(er.code||er.message);$('#lErr').textContent=/network/i.test(c)?'ইন্টারনেট সংযোগ নেই':/too-many/i.test(c)?'অনেকবার ভুল হয়েছে, কিছুক্ষণ পরে চেষ্টা করুন':'ই-মেইল বা পাসওয়ার্ড ভুল'}).then(function(){b.disabled=false;b.textContent='লগইন →'});
  });
  $('#lForgot').addEventListener('click',function(e){e.preventDefault();var em=$('#lEmail').value.trim();if(!em){$('#lErr').textContent='আগে ই-মেইল লিখুন, তারপর এখানে চাপ দিন';return}auth.sendPasswordResetEmail(em).then(function(){$('#lErr').style.color='#0b6b4f';$('#lErr').textContent='পাসওয়ার্ড পুনঃস্থাপনের লিঙ্ক ই-মেইলে প্রেরণ করা হয়েছে'}).catch(function(){$('#lErr').textContent='ই-মেইল প্রেরণ করা যায়নি'})});
}
window.__MDR={S:S,UI:UI,go:go,render:render};
boot();
})();
