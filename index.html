<style>
:root{--pri:#0b6b4f;--pri2:#0e8560;--dark:#0b3d2e;--gold:#b8912f;--bg:#f3f6f4;--card:#fff;--text:#1f2933;--mut:#4a555c;--line:#e1e8e4;--red:#c0392b;--amber:#d98e04;--blue:#1f4a73;--sh:0 2px 10px rgba(16,40,32,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.55}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{margin:0}
/* header & nav */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:linear-gradient(135deg,#0a5a43,#0b6b4f);color:#fff;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.brand b{display:block;font-size:16.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;font-size:12px;color:#e6f4ee}
.ico{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;width:40px;height:40px;font-size:19px;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(16,40,32,.08);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:transparent;color:#3d4a52;font-size:11.5px;font-weight:700;padding:5px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button i{font-style:normal;font-size:20px;line-height:24px}.nav button.on{background:var(--pri);color:#fff}
main{padding:14px 12px 96px;max-width:1100px;margin:0 auto}
@media(min-width:900px){.nav{top:62px;right:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:12px 10px;gap:4px;box-shadow:none}.nav button{flex:none;flex-direction:row;gap:10px;justify-content:flex-start;font-size:15px;padding:11px 12px}main{margin-left:200px;max-width:none;padding:20px 24px 40px}main>.wrap{max-width:1000px}}
/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card>h3,.ttl{font-size:18px;font-weight:700;color:#12352d;margin-bottom:10px}
.pg{font-size:21px;font-weight:700;color:#12352d;margin:2px 0 12px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}.g3d{grid-template-columns:repeat(3,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh)}.stat small{display:block;color:var(--mut);font-weight:600;font-size:13px}.stat b{font-size:21px;color:var(--pri)}.stat.red b{color:var(--red)}.stat.gold b{color:#8a6d1a}
.btn{border:0;background:var(--pri);color:#fff;font-weight:700;border-radius:12px;padding:11px 16px;cursor:pointer;font-size:15px}.btn:active{filter:brightness(.92)}
.btn.sec{background:#e9f0ec;color:#12352d;border:1px solid #bccbc3}.btn.red{background:var(--red)}.btn.gold{background:var(--gold)}.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}.btn.full{width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.bar .grow{flex:1;min-width:140px}
label{display:block;font-size:14px;font-weight:700;color:#26323a;margin:10px 0 4px}
input,select,textarea{width:100%;background:#fff;border:1.5px solid #cfd8d3;border-radius:12px;padding:10px 12px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(11,107,79,.14)}
input[type=checkbox],input[type=radio]{width:auto}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px;overflow-x:auto}.tabs button{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:10px;padding:9px 12px;font-weight:700;color:#3d4a52;cursor:pointer}.tabs button.on{background:var(--pri);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #edf2ef}.row:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:50%;background:#eaf6f0;border:1px solid #bcdccd;color:var(--pri);display:grid;place-items:center;font-weight:700;flex:none}
.info{flex:1;min-width:0}.info b{display:block;font-size:15.5px;line-height:1.35;color:#12352d}.info small{display:block;color:var(--mut);font-size:13px}
.acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;background:#eaf6f0;color:var(--pri);white-space:nowrap}.badge.red{background:#fdecea;color:var(--red)}.badge.gold{background:#fff4d6;color:#8a6d1a}.badge.gray{background:#eef2f0;color:#3d4a52}
.amt{font-weight:700;white-space:nowrap}.amt.in{color:var(--pri)}.amt.out{color:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{border-bottom:1px solid #edf2ef;padding:8px 6px;text-align:left;vertical-align:middle}.tbl th{background:#f3f8f5;color:#12352d;font-weight:700;white-space:nowrap}.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.brand .logo{overflow:hidden;padding:0}.brand .logo img,.lbox .lg img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}.lbox .lg{overflow:hidden}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:16px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}.tile i{font-style:normal;font-size:30px}.tile b{font-size:15.5px;color:#12352d}.tile small{color:var(--mut);font-size:12.5px}
.pr .hd img{height:66px;width:66px;border-radius:50%;margin-bottom:2px}
.note{background:#fffaf0;border:1px solid #ecdcb0;color:#5a4710;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.seg{display:inline-flex;border:1.5px solid #cfd8d3;border-radius:10px;overflow:hidden}.seg button{border:0;background:#fff;padding:7px 11px;font-weight:700;font-size:13.5px;color:#3d4a52;cursor:pointer;border-right:1px solid #e1e8e4}.seg button:last-child{border-right:0}
.seg button.p.on{background:var(--pri);color:#fff}.seg button.a.on{background:var(--red);color:#fff}.seg button.l.on{background:var(--amber);color:#fff}
.mk{width:70px;padding:7px 6px;text-align:center}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,30,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-size:19px;color:#12352d;margin-bottom:6px}.sheet .x{float:right;border:0;background:#eef2f0;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.mrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #e1e8e4}.mrow label{margin:0;font-weight:600;flex:1}.mrow input{margin-top:3px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:#12352d;color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;max-width:90%;display:none;text-align:center}
#toast.err{background:var(--red)}
/* login */
.screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#f6fbf7,#e3f0e7)}
.lbox{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:62px 22px 22px;box-shadow:0 14px 40px rgba(31,90,55,.14);position:relative;border:1px solid #e3eee5}
.lbox .lg{position:absolute;left:50%;top:-44px;transform:translateX(-50%);width:88px;height:88px;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 6px 20px rgba(31,90,55,.2);display:grid;place-items:center;font-size:44px}
.lbox h1{font-size:21px;text-align:center;color:#12352d;margin:0 0 2px}.lbox p{text-align:center;color:var(--mut);margin:0 0 8px;font-size:13.5px}
.err{color:var(--red);font-size:13.5px;min-height:18px;margin-top:6px;text-align:center}
/* print */
#printArea{display:none}
.pr{font-family:'Noto Sans Bengali',sans-serif;color:#111;word-spacing:normal;letter-spacing:normal}
.pr .hd{text-align:center;border-bottom:3px double #0b6b4f;padding-bottom:6px;margin-bottom:10px}.pr .hd h1{margin:0;font-size:24px;color:#0b3d2e}.pr .hd div{font-size:13px}
.pr h2{text-align:center;font-size:18px;margin:6px 0 10px;text-decoration:underline}
.pr table{width:100%;border-collapse:collapse;font-size:14px}.pr th,.pr td{border:1px solid #333;padding:5px 7px}.pr th{background:#eef5f0}.pr td.n,.pr th.n{text-align:right}
.pr .info2{display:flex;flex-wrap:wrap;gap:4px 24px;font-size:14px;margin-bottom:10px}.pr .info2 div{min-width:45%}
.pr .sign{display:flex;justify-content:space-between;margin-top:46px;font-size:13px}.pr .sign span{border-top:1px solid #333;padding-top:3px;min-width:120px;text-align:center}
.pr .tbl{font-size:11px}.pr .tbl td,.pr .tbl th{padding:3px 2px}.pr .pb{page-break-after:always;padding:6px}.pr .pb:last-child{page-break-after:auto}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}@page{size:A4;margin:12mm}.pr .pb{border:0}}
</style>

<body>
<div id="login" class="screen hidden">
  <form class="lbox" id="lform" autocomplete="on">
    <div class="lg" id="lgLogo">🕌</div>
    <h1 id="lName" style="font-size:18px;line-height:1.4">উত্তর ঘাটচেক গাউসিয়া তৈয়্যবিয়া কাছিমিয়া সুন্নিয়া মাদ্রাসা</h1><p>শুধু অফিস/প্রশাসকের জন্য — লগইন করুন</p>

    <label for="lPass">পাসওয়ার্ড</label><input id="lPass" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড" required>

  </form>
</div>

var $=function(s,r){return(r||document).querySelector(s)};

var BND='০১২৩৪৫৬৭৮৯';
var bn=function(x){return String(x).replace(/\d/g,function(d){return BND[d]})};
var num=function(v){var n=parseFloat(String(v).replace(/[০-৯]/g,function(d){return BND.indexOf(d)}).replace(/,/g,''));return isNaN(n)?0:n};
var fm=function(n){n=Math.round(num(n)*100)/100;var neg=n<0;n=Math.abs(n);var s=n.toLocaleString('en-IN',{maximumFractionDigits:2});return(neg?'-':'')+bn(s)};

function gradeOf(pct){var g=cfg().grades;for(var i=0;i<g.length;i++)if(pct>=g[i].min)return g[i];return g[g.length-1]}
function gradeOfGPA(gpa){var g=cfg().grades.slice().sort(function(a,b){return b.p-a.p});for(var i=0;i<g.length;i++)if(g[i].p<=gpa+1e-9)return g[i].g;return g[g.length-1].g}
function calcResult(ex){
  var rows=activeSts(ex.cls).map(function(st){
    var mk=(ex.marks&&ex.marks[st.id])||{},tot=0,full=0,fail=false,pts=0,subs=[];
    ex.subjects.forEach(function(sb,i){var v=mk[i],has=v!==undefined&&v!==null&&v!=='',o=has?num(v):0,pct=sb.full?o/sb.full*100:0,g=gradeOf(pct),pass=pct>=num(cfg().pass);if(!pass)fail=true;tot+=o;full+=sb.full;pts+=g.p;subs.push({n:sb.n,full:sb.full,o:o,has:has,g:g.g,pass:pass})});
    var pct=full?tot/full*100:0,gpa=fail?0:(ex.subjects.length?pts/ex.subjects.length:0);
    return{st:st,subs:subs,tot:tot,full:full,pct:pct,gpa:gpa,grade:fail?'F':gradeOfGPA(gpa),fail:fail,entered:Object.keys(mk).length>0};
  });
  var ranked=rows.filter(function(r){return r.entered&&!r.fail}).sort(function(a,b){return b.tot-a.tot||byRoll(a.st,b.st)});
  ranked.forEach(function(r,i){r.pos=i+1});
  return rows;
}

function opening(m){var d=m+'-01',a=0;S.payments.forEach(function(p){if((p.date||'')<d)a+=num(p.amount)});S.donations.forEach(function(p){if((p.date||'')<d)a+=num(p.amount)});S.cash.forEach(function(c){if((c.date||'')<d)a+=(c.type==='in'?1:-1)*num(c.amt)});return a}
function vCash(){
  var m=UI.cm,fi=feesIn(m),di=donsIn(m),dc=S.donations.filter(function(x){return(x.date||'').slice(0,7)===m}).length,ci=0,co=0,fc=S.payments.filter(function(p){return(p.date||'').slice(0,7)===m}).length;
  var ent=S.cash.filter(function(c){return(c.date||'').slice(0,7)===m}).sort(function(a,b){return String(b.date+b.ts).localeCompare(String(a.date+a.ts))});
  ent.forEach(function(c){if(c.type==='in')ci+=num(c.amt);else co+=num(c.amt)});
  var op=opening(m),inn=fi+di+ci,bal=op+inn-co;
  var h='<div class="pg">📒 আয়-ব্যয় হিসাব</div><div class="bar"><input type="month" id="cm" value="'+m+'" style="width:auto"><button class="btn grow" data-a="cashForm">➕ আয়/ব্যয় লিখুন</button><button class="btn sec sm" data-a="cashPrint">🖨️ প্রিন্ট</button></div>';

function pubPublish(){
  if(!FB){toast('Firebase সংযুক্ত না থাকলে পাবলিক পাতা চালানো যায় না',true);return}
  var pa=paidAll(),c=cfg(),ids=c.pubExams||[],ops=[],today=todayISO();
  var exr=S.exams.filter(function(e){return ids.indexOf(e.id)>=0}).map(function(e){return{ex:e,res:calcResult(e)}});
  var m0=today.slice(0,7);
  S.students.forEach(function(st){
    var o=clean(st);
    if(st.status==='left'){if(st.gcode)ops.push(['pub',st.gcode,null]);return}
    if(!o.gcode){o.gcode=newCode();ops.push(['students',o.id,o])}
    var d=duesOf(st,pa),pays=S.payments.filter(function(p){return p.sid===st.id}).sort(function(a,b){return String(b.date).localeCompare(String(a.date))}).slice(0,8).map(function(p){return{d:p.date,a:num(p.amount),t:p.type,m:(p.items||[]).map(function(i){return monthLabel(i.m)}).join(', '),no:p.no||''}});
    var pr=0,ab=0,lv=0;S.attendance.forEach(function(r){if(r.date.slice(0,7)===m0&&r.rec&&r.rec[st.id]){var v=r.rec[st.id];if(v==='p')pr++;else if(v==='a')ab++;else lv++}});
    var rs=[];exr.forEach(function(x){x.res.forEach(function(r){if(r.st.id===st.id&&r.entered)rs.push({n:x.ex.name,cls:x.ex.cls,tot:r.tot,full:r.full,pct:Math.round(r.pct*10)/10,gpa:Math.round(r.gpa*100)/100,grade:r.grade,pos:r.pos||0,fail:!!r.fail,subs:r.subs.map(function(q){return{n:q.n,f:q.full,o:q.o,g:q.g}})})})});
    ops.push(['pub',o.gcode,{name:st.name,cls:st.cls,roll:st.roll||'',father:st.father||'',fee:num(st.fee),dues:d.map(function(x){return{m:x.m,due:x.due}}),due:sumDue(d),pays:pays,att:{p:pr,a:ab,l:lv,m:m0},res:rs,upd:today}]);
  });
  ops.push(['pub','_info',{name:c.name,addr:c.addr||'',phone:c.phone||'',session:c.session||'',bkash:c.bkash||'',nagad:c.nagad||'',rocket:c.rocket||'',payNote:c.payNote||'',upd:today}]);
  toast('হালনাগাদ হচ্ছে…');
  var chunks=[];for(var i=0;i<ops.length;i+=400)chunks.push(ops.slice(i,i+400));
  var p=Promise.resolve();
  chunks.forEach(function(ch){p=p.then(function(){var b=fs.batch();ch.forEach(function(o){var ref=base.collection(o[0]).doc(String(o[1]).replace(/\//g,'-'));if(o[2]===null)b.delete(ref);else b.set(ref,o[2])});return b.commit()})});
  p.then(function(){UI.pubAt=today+' '+new Date().toTimeString().slice(0,5);toast('পাবলিক পাতা হালনাগাদ হয়েছে ✅');render()}).catch(err);
}

/* ---------- STAFF (শিক্ষক-কর্মচারী) ---------- */
var ROLES=['শিক্ষক','হাফেজ','ক্বারী','মুহাদ্দিস','মুহতামিম','খাদেম','বাবুর্চি','কর্মচারী'];
var stfById=function(id){return S.staff.filter(function(x){return x.id===id})[0]};
function stfPaid(id,m){return S.cash.filter(function(c){return c.stf===id&&c.sm===m}).reduce(function(a,c){return a+num(c.amt)},0)}
function stfFiltered(){
  var q=UI.tq.trim().toLowerCase();
  return S.staff.filter(function(s){return!q||(s.name+' '+(s.role||'')+' '+(s.phone||'')).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return(a.status==='left')-(b.status==='left')||String(a.name).localeCompare(String(b.name))});
}
function stfList(){
  var l=stfFiltered(),m=UI.tm;
  return l.length?l.map(function(s){var paid=stfPaid(s.id,m),left=s.status==='left';return'<div class="row"><div class="av">'+(s.photo?'<img src="'+esc(s.photo)+'" alt="">':esc((s.name||'?').charAt(0)))+'</div><div class="info"><b>'+esc(s.name)+(left?' <span class="badge gray">ছেড়ে গিয়েছেন</span>':'')+'</b><small>'+esc(s.role||'—')+(s.phone?' • '+bn(esc(s.phone)):'')+' • বেতন '+money(s.salary)+'</small>'+(left?'':(paid>0?'<small style="color:#0b6b4f;font-weight:700">'+monthLabel(m)+': প্রদত্ত '+money(paid)+'</small>':'<small style="color:#c0392b;font-weight:700">'+monthLabel(m)+': বেতন বাকি</small>'))+'</div><div class="acts"><button class="btn sm sec" data-a="stfForm" data-id="'+s.id+'">✏️</button>'+(left?'':'<button class="btn sm" data-a="stfPay" data-id="'+s.id+'">💵</button>')+'</div></div>'}).join(''):'<div class="empty">কোনো শিক্ষক/কর্মচারী নেই। "নতুন সংযোজন" চাপ দিন।</div>';
}
function vStaff(){
  var act=S.staff.filter(function(s){return s.status!=='left'}),sal=0,paid=0;
  act.forEach(function(s){sal+=num(s.salary);paid+=stfPaid(s.id,UI.tm)});
  return'<div class="pg">👨‍🏫 শিক্ষক-কর্মচারী</div><div class="grid g4" style="margin-bottom:12px"><div class="stat"><small>সক্রিয়</small><b>'+bn(act.length)+' জন</b></div><div class="stat"><small>মাসিক বেতন বাবদ</small><b>'+money(sal)+'</b></div><div class="stat"><small>'+monthLabel(UI.tm)+' প্রদত্ত</small><b>'+money(paid)+'</b></div><button class="btn" data-a="stfForm" style="font-size:16px">➕ নতুন সংযোজন</button></div><div class="bar"><input class="grow" id="tq" placeholder="🔎 নাম / পদ / মোবাইল" value="'+esc(UI.tq)+'"><input type="month" id="tm" value="'+UI.tm+'" style="width:auto"><button class="btn sec sm" data-a="stfPrint">🖨️ প্রিন্ট</button></div><div class="card" id="tList">'+stfList()+'</div>';
}
function stfForm(id){
  var s=id?stfById(id):null;
  modal('<h3>'+(s?'✏️ তথ্য সম্পাদনা':'➕ নতুন শিক্ষক / কর্মচারী')+'</h3><input type="hidden" id="tId" value="'+(s?s.id:'')+'">'+photoRow('t',s?s.photo:'')+'<label>নাম *</label><input id="tName" value="'+esc(s?s.name:'')+'"><label>পদ / দায়িত্ব</label><input id="tRole" list="roleList" value="'+esc(s?s.role||'':'শিক্ষক')+'"><datalist id="roleList">'+ROLES.map(function(r){return'<option value="'+esc(r)+'">'}).join('')+'</datalist><label>মোবাইল</label><input id="tPhone" type="tel" inputmode="tel" value="'+esc(s?s.phone||'':'')+'"><label>ঠিকানা</label><input id="tAddr" value="'+esc(s?s.addr||'':'')+'"><div class="grid g2"><div><label>যোগদানের তারিখ</label><input id="tJoin" type="date" value="'+(s?s.join||'':todayISO())+'"></div><div><label>মাসিক বেতন (৳)</label><input id="tSal" inputmode="decimal" value="'+(s?s.salary:'')+'"></div></div>'+(s?'<label>অবস্থা</label><select id="tStatus"><option value="active"'+(s.status!=='left'?' selected':'')+'>সক্রিয়</option><option value="left"'+(s.status==='left'?' selected':'')+'>ছেড়ে গিয়েছেন</option></select>':'')+'<label>শিক্ষাগত যোগ্যতা</label><input id="tQual" value="'+esc(s?s.qual||'':'')+'"><label>জাতীয় পরিচয়পত্র নম্বর (শুধু প্রশাসকের জন্য)</label><input id="tNid" inputmode="numeric" value="'+esc(s?s.nid||'':'')+'"><label>দায়িত্ব / পাঠদানের বিষয়</label><input id="tDuty" value="'+esc(s?s.duty||'':'')+'" placeholder="যেমন: কুরআন ও আরবি, প্রথম ও দ্বিতীয় শ্রেণি"><label>নোট</label><input id="tNote" value="'+esc(s?s.note||'':'')+'"><div class="bar" style="margin-top:14px;flex-wrap:wrap"><button class="btn grow" data-a="stfSave">💾 সংরক্ষণ</button>'+(s?'<button class="btn sec" data-a="appLetter" data-id="'+s.id+'">📄 নিয়োগপত্র</button><button class="btn sec" data-a="lvNew" data-id="'+s.id+'">🏖️ ছুটি</button><button class="btn red" data-a="stfDel" data-id="'+s.id+'">মুছুন</button>':'')+'</div>');
}
function stfSave(){
  var name=$('#tName').value.trim();if(!name){toast('নাম লিখুন',true);return}
  var id=$('#tId').value,old=id?stfById(id):null,o=old?clean(old):{};
  Object.assign(o,{name:name,role:$('#tRole').value.trim(),phone:$('#tPhone').value.trim(),addr:$('#tAddr').value.trim(),join:$('#tJoin').value,salary:num($('#tSal').value),status:$('#tStatus')?$('#tStatus').value:'active',note:$('#tNote').value.trim(),photo:($('#tPhoto')||{}).value||'',qual:$('#tQual').value.trim(),nid:$('#tNid').value.trim(),duty:$('#tDuty').value.trim()});
  if(!o.id)o.id=uid();
  put('staff',o).then(function(){toast(old?'সংরক্ষিত হয়েছে':'যোগ হয়েছে ✅')});closeModal();
}
function stfPay(id){
  var s=stfById(id);if(!s)return;
  modal('<h3>💵 বেতন প্রদান</h3><p><b>'+esc(s.name)+'</b> ('+esc(s.role||'')+')</p><label>কোন মাসের বেতন</label><input id="pMonth" type="month" value="'+UI.tm+'"><label>টাকা (৳)</label><input id="pAmt" inputmode="decimal" value="'+num(s.salary)+'"><div class="grid g2"><div><label>তারিখ</label><input id="pDate" type="date" value="'+todayISO()+'"></div><div><label>নোট</label><input id="pNote"></div></div><div class="note" style="margin-top:10px">এটি আয়-ব্যয় হিসাবে স্বয়ংক্রিয়ভাবে ব্যয় হিসেবে যুক্ত হবে।</div><button class="btn full" data-a="stfPaySave" data-id="'+id+'">💾 প্রদান সংরক্ষণ</button>');
}
function stfPaySave(id){
  var s=stfById(id),m=$('#pMonth').value,amt=num($('#pAmt').value);
  if(!s||!m){toast('মাস বাছাই করুন',true);return}
  if(amt<=0){toast('টাকার পরিমাণ লিখুন',true);return}
  var dv=$('#pDate').value||todayISO(),nv=$('#pNote').value.trim();
  var go2=function(){
  put('cash',{id:uid(),type:'out',cat:'শিক্ষক/কর্মচারী বেতন',amt:amt,date:dv,note:s.name+' — '+monthLabel(m)+' মাসের বেতন'+(nv?' ('+nv+')':''),stf:id,sm:m});
  UI.tm=m;closeModal();toast('বেতন প্রদান সংরক্ষিত ✅');
  };
  if(stfPaid(id,m)>0)ask('এই মাসের বেতন আগেও দেওয়া হয়েছে। আবার লিখবেন?','হ্যাঁ, লিখুন',go2);else go2();
}
function stfPrint(){
  var l=stfFiltered().filter(function(s){return s.status!=='left'}),tot=0,pd=0;
  var rows=l.map(function(s,i){var p=stfPaid(s.id,UI.tm);tot+=num(s.salary);pd+=p;return'<tr><td>'+bn(i+1)+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.role||'')+'</td><td>'+bn(esc(s.phone||''))+'</td><td class="n">'+fm(s.salary)+'</td><td class="n">'+(p?fm(p):'—')+'</td></tr>'}).join('');
  printHTML('<div class="pb">'+hdr()+'<h2>শিক্ষক-কর্মচারী তালিকা ও বেতন — '+monthLabel(UI.tm)+'</h2><table><tr><th>ক্রম</th><th>নাম</th><th>পদ</th><th>মোবাইল</th><th class="n">বেতন</th><th class="n">প্রদত্ত</th></tr>'+rows+'<tr><th colspan="4">মোট</th><th class="n">'+fm(tot)+'</th><th class="n">'+fm(pd)+'</th></tr></table><div class="sign"><span>হিসাবরক্ষক</span><span>'+esc(cfg().head)+'</span></div></div>');
}

/* ---------- PROMOTION (শ্রেণি উত্তরণ) ---------- */
function vPromote(){
  var cls=classNames(),ses=cfg().session,ny=String((parseInt(ses)||new Date().getFullYear())+1);
  var h='<div class="pg">🎓 শ্রেণি উত্তরণ</div><div class="note">নতুন শিক্ষাবর্ষ শুরুতে ছাত্রদের পরের শ্রেণিতে তুলতে এটি ব্যবহার করুন। প্রতিটি শ্রেণির গন্তব্য বাছাই করুন; যাদের উত্তীর্ণ করবেন না (পুনরায় একই শ্রেণি) তাদের টিক তুলে দিন। শ্রেণির ক্রম <b>সেটিংস</b>-এর তালিকার ক্রম অনুযায়ী। <b>আগে ব্যাকআপ গ্রহণ করুন।</b></div>';
  h+='<div class="card"><div class="grid g2"><div><label>নতুন শিক্ষাবর্ষ</label><input id="prYear" value="'+esc(ny)+'"></div><div><label>নতুন বেতন কার্যকর মাস</label><input id="prMonth" type="month" value="'+todayISO().slice(0,7)+'"></div></div><div class="mrow"><input type="checkbox" id="prFee" checked><label for="prFee">মাসিক বেতন নতুন শ্রেণির ফি অনুযায়ী বদলান (আগের মাসের বকেয়া আগের ফি-তেই থাকবে)</label></div></div>';
  var any=false;
  cls.forEach(function(c,i){
    var sts=activeSts(c);if(!sts.length)return;any=true;var def=cls[i+1]||'__end';
    h+='<div class="card"><h3>'+esc(c)+' <small style="font-size:13px;color:#4a555c">('+bn(sts.length)+' জন)</small></h3><label>এই শ্রেণির ছাত্ররা যাবে</label><select data-pc="'+esc(c)+'">'+cls.map(function(x){return'<option value="'+esc(x)+'"'+(x===def?' selected':'')+'>'+esc(x)+(x===c?' (একই শ্রেণিতে)':'')+'</option>'}).join('')+'<option value="__end"'+(def==='__end'?' selected':'')+'>✅ সমাপ্ত (মাদ্রাসা ছাড়ছে)</option></select><div style="margin-top:6px">'+sts.map(function(s){return'<div class="mrow"><input type="checkbox" class="pk" id="pk_'+s.id+'" data-s="'+s.id+'" checked><label for="pk_'+s.id+'">'+bn(s.roll||'-')+'. '+esc(s.name)+'</label></div>'}).join('')+'</div></div>';
  });
  if(!any)return h+'<div class="card empty">কোনো সক্রিয় ছাত্র নেই</div>';
  return h+'<button class="btn full" data-a="prApply">🎓 উত্তরণ কার্যকর করুন</button>';
}
function prApply(){
  var yr=$('#prYear').value.trim(),em=$('#prMonth').value,chFee=$('#prFee').checked;
  if(!yr||!em){toast('শিক্ষাবর্ষ ও কার্যকর মাস দিন',true);return}
  var moves=[];
  $$('select[data-pc]').forEach(function(sel){
    var c=sel.dataset.pc,dest=sel.value;
    activeSts(c).forEach(function(s){var cb=document.getElementById('pk_'+s.id);if(cb&&cb.checked&&dest!==c)moves.push({s:s,dest:dest})});
  });
  if(!moves.length){toast('বদলানোর মতো কোনো ছাত্র বাছাই নেই',true);return}
  ask(bn(moves.length)+' জন ছাত্রের শ্রেণি বদলে যাবে। ব্যাকআপ নিয়েছেন তো? এগিয়ে যাবেন?','এগিয়ে যান',function(){
  var moving={},maxRoll={},prev=addMonths(em,-1),sess=cfg().session;
  moves.forEach(function(m){moving[m.s.id]=1});
  S.students.forEach(function(s){if(s.status!=='left'&&!moving[s.id])maxRoll[s.cls]=Math.max(maxRoll[s.cls]||0,rollNum(s))});
  moves.sort(function(a,b){return byRoll(a.s,b.s)});
  moves.forEach(function(m){
    var o=clean(m.s);o.hist=(o.hist||[]).concat([{session:sess,cls:o.cls,roll:o.roll||''}]);
    if(m.dest==='__end'){o.status='left';o.leftNote='শিক্ষাবর্ষ '+sess+' শেষে সমাপ্ত'}
    else{
      var oldFee=num(o.fee);o.cls=m.dest;maxRoll[m.dest]=(maxRoll[m.dest]||0)+1;o.roll=String(maxRoll[m.dest]);
      if(chFee){var nf=classFee(m.dest);if(nf!==oldFee){o.fh=(o.fh||[]).concat([{to:prev,fee:oldFee}]);o.fee=nf}}
    }
    put('students',o);
  });
  var so=clean(cfg());so.session=yr;putSettings(so);
  toast('উত্তরণ সম্পন্ন ✅ — '+bn(moves.length)+' জন');go('students');
  });
}

function restore(file){

    ask('ব্যাকআপ থেকে তথ্য ফেরত আনবেন? একই আইডির বর্তমান তথ্য বদলে যাবে।','ফেরত আনুন',function(){

    var ops=[];COLS.forEach(function(c){(d[c]||[]).forEach(function(x){ops.push([c,x])})});
    var chunks=[];for(var i=0;i<ops.length;i+=400)chunks.push(ops.slice(i,i+400));
    var p=base.collection('meta').doc('settings').set(d.settings);
    chunks.forEach(function(ch){p=p.then(function(){var b=fs.batch();ch.forEach(function(o){b.set(base.collection(o[0]).doc(String(o[1].id).replace(/\//g,'-')),o[1])});return b.commit()})});
    p.then(function(){toast('তথ্য পুনরুদ্ধার হয়েছে ✅')}).catch(err);
    });
  };fr.readAsText(file);
}

    h+=PUB.people===null?'<div class="empty">লোড হচ্ছে…</div>':(grp('committee','পরিচালনা কমিটি')+grp('advisor','উপদেষ্টাবৃন্দ')||'<div class="empty">এখনও যুক্ত করা হয়নি</div>');

function pubResult(r){

}
